[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "es-rag-tuning-workbench"
version = "1.11.0"
description = "A local Elasticsearch lexical and vector retrieval tuning workbench"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["argon2-cffi>=23.1,<26"]

[project.optional-dependencies]
semantic = ["fastembed>=0.9,<1"]
token-preview = ["tokenizers>=0.20,<1", "huggingface-hub>=0.25,<2"]
private-vector = ["fastembed>=0.9,<1", "tokenizers>=0.20,<1", "huggingface-hub>=0.25,<2"]
agents = [
    "openai-codex>=0.163,<0.164; python_version >= '3.10'",
    "github-copilot-sdk>=1.0.22,<2; python_version >= '3.11'",
]
dev = ["build>=1.2,<2", "pytest>=8,<9"]

[project.scripts]
es-rag-workbench = "es_rag_tuner.__main__:main"

[tool.setuptools]
packages = ["es_rag_tuner"]
include-package-data = true

[tool.setuptools.package-data]
es_rag_tuner = ["data/*.json", "data/*.ndjson", "web/*.html", "web/*.js", "web/*.css"]
