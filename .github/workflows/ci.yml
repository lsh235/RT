name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/run_offline_tests.py
      - run: python scripts/package_smoke.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  elasticsearch:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run live acceptance against disposable service
        env:
          ES_RAG_ACCEPTANCE_ES_URL: http://127.0.0.1:9200
          ES_RAG_ACCEPTANCE_SOURCE_INDEX: ci-no-source-index
          ES_RAG_CONCEPT_DB: ${{ runner.temp }}/es-rag-ci/concepts.sqlite3
          HOME: ${{ runner.temp }}/es-rag-ci/home
          ES_RAG_RUN_LIVE: "1"
        run: |
          mkdir -p "$HOME" "$(dirname "$ES_RAG_CONCEPT_DB")"
          export ES_RAG_ACCEPTANCE_PYTHON="$(command -v python)"
          python -m unittest discover -s tests -p 'live_concept_acceptance.py' -v
