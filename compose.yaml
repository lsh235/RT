services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    network_mode: host
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_SETTING_NETWORK_HOST: 127.0.0.1
      ES_SETTING_HTTP_PORT: ${ES_RAG_ES_PORT:-19200}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/${ES_RAG_ES_PORT:-19200}"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_RAG_CONCEPT_DB: /var/lib/es-rag-workbench/concepts.sqlite3
    command: ["--host", "127.0.0.1", "--port", "${ES_RAG_APP_PORT:-18765}"]
    volumes:
      - workbench_data:/var/lib/es-rag-workbench
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ES_RAG_APP_PORT:-18765}/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  elasticsearch_data:
  workbench_data:
